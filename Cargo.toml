[package]
name = "fireworks"
version = "0.1.0"
edition = "2024"
description = "A pyrotechnic screensaver for the terminal"
license = "MIT"
keywords = ["tui", "terminal", "fireworks", "screensaver", "ratatui"]
categories = ["command-line-interface", "graphics"]

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
crossterm = "0.29"
rand = "0.9"
ratatui = "0.30"
